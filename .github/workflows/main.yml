name: Miner Automation - W7, W8, W9

on:
  workflow_dispatch:
    inputs:
      workflow_choice:
        description: 'Select workflow to run'
        required: true
        default: 'W7'
        type: choice
        options:
          - 'W7 - Terminals 181 to 210'
          - 'W8 - Terminals 211 to 240'
          - 'W9 - Terminals 241 to 270'

jobs:
  mining:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Show System Info
      shell: pwsh
      run: |
        Write-Host "=== SYSTEM INFORMATION ==="
        Write-Host ""
        Write-Host "CPU:"
        Get-WmiObject -Class Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
        Write-Host ""
        Write-Host "RAM:"
        $ram = Get-WmiObject -Class Win32_ComputerSystem
        Write-Host "Total Physical Memory: $([math]::Round($ram.TotalPhysicalMemory / 1GB, 0)) GB"
        Write-Host ""
        Write-Host "OS:"
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion
        Write-Host ""
        Write-Host "Disk:"
        Get-PSDrive -Name C | Select-Object Used, Free
    
    - name: Install Firefox
      run: |
        choco install firefox -y
      shell: pwsh
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests psutil pillow
    
    - name: Run Workflow W7
      if: github.event.inputs.workflow_choice == 'W7 - Terminals 181 to 210'
      run: python miner_w7_w8_w9.py --workflow W7
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: Run Workflow W8
      if: github.event.inputs.workflow_choice == 'W8 - Terminals 211 to 240'
      run: python miner_w7_w8_w9.py --workflow W8
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: Run Workflow W9
      if: github.event.inputs.workflow_choice == 'W9 - Terminals 241 to 270'
      run: python miner_w7_w8_w9.py --workflow W9
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: miner-logs
        path: miner_monitor.log
        retention-days: 7
